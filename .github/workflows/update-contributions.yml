name: Update yearly contributions

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Get this year's contribution count
        id: contributions
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          COUNT=$(gh api graphql -f query='
            query($user: String!) {
              user(login: $user) {
                contributionsCollection {
                  contributionCalendar {
                    totalContributions
                  }
                }
              }
            }
          ' -F user=sairajKhilariArch --jq '.data.user.contributionsCollection.contributionCalendar.totalContributions')

          echo "count=$COUNT" >> "$GITHUB_OUTPUT"

      - name: Update README
        env:
          COUNT: ${{ steps.contributions.outputs.count }}
        run: |
          python3 - <<'PY'
          import os
          import pathlib

          readme = pathlib.Path("README.md")
          text = readme.read_text(encoding="utf-8")

          start = "<!-- CONTRIBUTIONS_START -->"
          end = "<!-- CONTRIBUTIONS_END -->"

          before, rest = text.split(start, 1)
          _, after = rest.split(end, 1)

          count = os.environ["COUNT"]
          readme.write_text(f"{before}{start}{count}{end}{after}", encoding="utf-8")
          PY

      - name: Commit and push changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          if git diff --quiet; then
            echo "No changes to commit"
            exit 0
          fi

          git add README.md
          git commit -m "chore: update yearly contribution count"
          git push
